<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Stream Preview</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .app {
        width: 100%;
        max-width: 1100px;
        background: #1e293b;
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }

      .header {
        margin-bottom: 20px;
      }

      .title {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .subtitle {
        font-size: 15px;
        color: #cbd5e1;
      }

      .video-wrap {
        position: relative;
        width: 100%;
        background: #020617;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid #334155;
        min-height: 520px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      video {
        width: 100%;
        height: 100%;
        min-height: 520px;
        object-fit: contain;
        display: block;
        background: black;
      }

      .empty-state {
        position: absolute;
        text-align: center;
        color: #94a3b8;
        pointer-events: none;
      }

      .empty-state h2 {
        font-size: 22px;
        color: #e2e8f0;
        margin-bottom: 8px;
      }

      .empty-state p {
        font-size: 14px;
      }

      .overlay-controls {
        position: absolute;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%) translateY(12px);
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
        background: rgba(15, 23, 42, 0.72);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(148, 163, 184, 0.25);
        padding: 12px;
        border-radius: 16px;
      }

      .video-wrap:hover .overlay-controls {
        opacity: 1;
        pointer-events: auto;
        transform: translateX(-50%) translateY(0);
      }

      button {
        border: none;
        outline: none;
        padding: 12px 18px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
        opacity: 0.95;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      #startBtn {
        background: #22c55e;
        color: white;
      }

      #stopBtn {
        background: #ef4444;
        color: white;
      }

      #upload-stream {
        background: #3b82f6;
        color: white;
      }

      .status-row {
        margin-top: 16px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        color: #94a3b8;
        font-size: 14px;
      }

      .badge {
        color: #e2e8f0;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 999px;
        padding: 6px 12px;
      }

      #fileInput {
        display: none;
      }
    </style>
  </head>

  <body>
    <div class="app">
      <div class="header">
        <div class="title">Live Video Stream</div>
        <div class="subtitle">
          Use camera or uploaded video.
        </div>
      </div>

      <div class="video-wrap" id="videoWrap">
        <video id="video" autoplay playsinline muted></video>

        <div class="empty-state" id="emptyState">
          <h2>No stream active</h2>
          <p>Hover here and choose Start Camera or Upload Stream.</p>
        </div>

        <div class="overlay-controls">
          <button id="startBtn">Start Camera</button>
          <button id="stopBtn" disabled>Stop</button>
          <button id="upload-stream">Upload Stream</button>
        </div>

        <input id="fileInput" type="file" accept="video/*" />
      </div>

      <div class="status-row">
        <div id="status">Status: Waiting for input</div>
        <div class="badge" id="streamType">Source: None</div>
      </div>
    </div>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
